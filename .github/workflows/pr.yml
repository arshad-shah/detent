name: pr

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm -F detent exec playwright install --with-deps chromium firefox webkit

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:browser

      - run: pnpm build

      - name: Bundle size budget
        run: pnpm size

      - run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: packages/detent/playwright-report/
          retention-days: 7

  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status compares against the base branch, so it needs
          # more than the default single commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every change to a package needs a changeset
        run: pnpm changeset status --since=origin/main
