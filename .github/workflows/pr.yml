name: pr

# Every pull request, not only those targeting main: stacked branches are
# normal and need the same gates as anything else.
on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The token is not written into .git/config, where any later step —
          # including a postinstall from any transitive dependency — could read
          # it. Nothing in this job pushes with the git CLI.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Once at the root: every package's browser tests share the install.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Build first: a wrapper's types resolve through detent's emitted
      # declarations, which do not exist until the core has been built.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:browser

      - name: Bundle size budget
        run: pnpm size

      # Nothing else builds the playground, so a broken one goes unnoticed —
      # which is exactly what happened when the packages were scoped and its
      # esbuild globalName became an invalid identifier. It reads dist/, so it
      # has to come after the build.
      - name: The playground still builds
        run: pnpm -F @arshad-shah/detent playground

      - run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: playwright-report
          path: packages/detent/playwright-report/
          retention-days: 7

  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # changeset status compares against the base branch, so it needs
          # more than the default single commit. Fetching does not need a
          # stored credential on a public repository, and nothing here pushes.
          fetch-depth: 0
          # The token is not written into .git/config, where any later step —
          # including a postinstall from any transitive dependency — could read
          # it. Nothing in this job pushes with the git CLI.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compare against this PR's own base, not always main. On a stacked
      # branch, --since=origin/main is satisfied by an ancestor's changeset
      # and the PR's own changes go unchecked.
      - name: Every change to a package needs a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  # A lockfile diff is not something a human reliably reads. This fails the pull
  # request outright when it introduces a dependency carrying a known advisory or
  # a licence the project cannot take — which matters more now that lockfile
  # changes arrive from contributors without write access.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          # The library itself ships zero dependencies; everything here is a dev
          # tool. Copyleft in a build tool is fine, so this only names licences
          # that would be a genuine problem to depend on.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
