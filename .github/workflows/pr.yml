name: pr

# Every pull request, not only those targeting main: stacked branches are
# normal and need the same gates as anything else.
on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Once at the root: every package's browser tests share the install.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Build first: a wrapper's types resolve through detent's emitted
      # declarations, which do not exist until the core has been built.
      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm test:browser

      - name: Bundle size budget
        run: pnpm size

      - run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: playwright-report
          path: packages/detent/playwright-report/
          retention-days: 7

  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # changeset status compares against the base branch, so it needs
          # more than the default single commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compare against this PR's own base, not always main. On a stacked
      # branch, --since=origin/main is satisfied by an ancestor's changeset
      # and the PR's own changes go unchecked.
      - name: Every change to a package needs a changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
