name: main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Once at the root: every package's browser tests share the install.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      # Build first: a wrapper's types resolve through detent's emitted
      # declarations, which do not exist until the core has been built.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:browser
      - name: Bundle size budget
        run: pnpm size
      - run: pnpm test:e2e

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # commit the version bump, push tags
      pull-requests: write   # open and update the Version Packages PR
      id-token: write        # OIDC, for provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # npm >= 11.5 authenticates to the registry over OIDC when the repository
      # is registered as a trusted publisher, so no token is stored here.
      - name: Use an npm new enough for trusted publishing
        run: npm install -g npm@^12

      # v2 renamed every one of these inputs from their v1 names.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51  # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
